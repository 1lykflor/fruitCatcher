<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Magic Fruit Catcher Mobile</title>
  
  <!-- Εδώ είναι οι σωστές και πλήρεις βιβλιοθήκες που έλειπαν -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.1.0/dist/handpose.min.js"></script>
  
  <style>
    body { margin: 0; padding: 0; background: #191e32; overflow: hidden; font-family: sans-serif; color: white; user-select: none; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.3; z-index: 1; }
    canvas { position: absolute; width: 100%; height: 100%; z-index: 2; top: 0; left: 0; }
    #ui { position: absolute; top: 20px; left: 0; width: 100%; display: flex; justify-content: space-around; font-size: 24px; font-weight: bold; z-index: 3; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    #fullscreen-btn { position: absolute; bottom: 30px; right: 30px; z-index: 4; background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; }
    #loading { position: absolute; width: 100%; text-align: center; top: 45%; font-size: 20px; z-index: 4; background: rgba(0,0,0,0.7); padding: 15px 0; }
  </style>
</head>
<body>

  <div id="container">
    <div id="ui">
      <div id="score">🍎 Σκορ: 0</div>
      <div id="timer">⏳ Χρόνος: 60s</div>
    </div>
    <button id="fullscreen-btn" onclick="openFullscreen()">📺 Fullscreen</button>
    <div id="loading">Αναμονή για την κάμερα...</div>
    <video id="video" playsinline autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const loadingEl = document.getElementById('loading');
    const fsBtn = document.getElementById('fullscreen-btn');

    let model = null; let score = 0; let timer = 60; let gameOver = false;
    let fruit = { x: 0, y: -50, speed: 4, size: 25 };
    let bomb = { x: 0, y: -150, speed: 5, size: 20 };
    let handsList = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if(fruit.y === -50) resetFruit();
      if(bomb.y === -150) resetBomb();
    }
    window.addEventListener('resize', resize);

    function resetFruit() {
      fruit.x = Math.random() * (canvas.width - 60) + 30;
      fruit.y = -50;
    }

    function resetBomb() {
      bomb.x = Math.random() * (canvas.width - 60) + 30;
      while(Math.abs(bomb.x - fruit.x) < 80) { bomb.x = Math.random() * (canvas.width - 60) + 30; }
      bomb.y = -200;
    }

    function openFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) { elem.requestFullscreen(); }
      else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
      fsBtn.style.display = 'none';
    }

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => { resolve(video); };
      });
    }

    function gameLoop() {
      if (gameOver) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Φρούτο
      fruit.y += fruit.speed;
      ctx.beginPath(); ctx.fillStyle = '#ff4646';
      ctx.arc(fruit.x, fruit.y, fruit.size, 0, Math.PI * 2); ctx.fill();
      if (fruit.y > canvas.height) resetFruit();

      // Βόμβα
      bomb.y += bomb.speed;
      ctx.beginPath(); ctx.fillStyle = '#9632cc';
      ctx.arc(bomb.x, bomb.y, bomb.size, 0, Math.PI * 2); ctx.fill();
      if (bomb.y > canvas.height) resetBomb();

      // Ασπίδες Χεριών
      handsList.forEach((hand, index) => {
        const palm = hand.landmarks[9]; // Σημείο στη μέση της παλάμης
        
        const vWidth = video.videoWidth || 640;
        const vHeight = video.videoHeight || 480;
        const hX = canvas.width - (palm[0] / vWidth * canvas.width);
        const hY = palm[1] / vHeight * canvas.height;

        ctx.beginPath();
        ctx.fillStyle = index === 0 ? 'rgba(50, 255, 150, 0.8)' : 'rgba(0, 200, 255, 0.8)';
        ctx.arc(hX, hY, 40, 0, Math.PI * 2); ctx.fill();

        if (Math.hypot(hX - fruit.x, hY - fruit.y) < 65) {
          score += 10; scoreEl.innerText = `🍎 Σκορ: ${score}`; resetFruit();
        }
        if (Math.hypot(hX - bomb.x, hY - bomb.y) < 60) {
          score = Math.max(0, score - 15); scoreEl.innerText = `🍎 Σκορ: ${score}`; resetBomb();
        }
      });
      requestAnimationFrame(gameLoop);
    }

    async function predictHands() {
      if (video.readyState >= 2 && model) {
        try {
          handsList = await model.estimateHands(video);
        } catch(err) { console.log(err); }
      }
      setTimeout(predictHands, 1000 / 30);
    }

    function startTimer() {
      const countdown = setInterval(() => {
        if (timer > 0) { timer--; timerEl.innerText = `⏳ Χρόνος: ${timer}s`; }
        else {
          gameOver = true; clearInterval(countdown);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ffd700'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText("🎉 ΤΕΛΟΣ ΠΑΙΧΝΙΔΙΟΥ! 🎉", canvas.width/2, canvas.height/2 - 20);
          ctx.font = '24px sans-serif'; ctx.fillStyle = '#ffffff';
          ctx.fillText(`Σκορ: ${score}`, canvas.width/2, canvas.height/2 + 30);
        }
      }, 1000);
    }

    async function main() {
      try {
        loadingEl.innerText = "1/2 Άνοιγμα κάμερας...";
        await setupCamera();
        video.play();
        
        await new Promise(r => setTimeout(r, 1000));
        resize();

        loadingEl.innerText = "2/2 Φόρτωση AI (Handpose)...";
        await tf.setBackend('webgl');
        model = await handpose.load();
        
        loadingEl.style.display = 'none';
        fsBtn.style.display = 'block';
        
        gameLoop();
        predictHands();
        startTimer();
      } catch (e) {
        loadingEl.innerHTML = "<span style='color:red;'>Σφάλμα αρχικοποίησης.</span><br>Παρακαλώ κάντε ανανέωση.";
        console.error(e);
      }
    }
    main();
  </script>
</body>
</html>
