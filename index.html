
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Magic Fruit Catcher</title>

<!-- TensorFlow.js 2.1.0 -->
<script src="https://unpkg.com/@tensorflow/tfjs-core@2.1.0/dist/tf-core.js"></script>
<script src="https://unpkg.com/@tensorflow/tfjs-converter@2.1.0/dist/tf-converter.js"></script>
<script src="https://unpkg.com/@tensorflow/tfjs-backend-webgl@2.1.0/dist/tf-backend-webgl.js"></script>

<!-- Handpose -->
<script src="https://unpkg.com/@tensorflow-models/handpose@0.0.6/dist/handpose.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #191e32;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    user-select: none;
    -webkit-user-select: none;
}

#container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.45;
    z-index: 1;
}

canvas {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 2;
}

#ui {
    position: absolute;
    top: 15px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    gap: 10px;
    font-size: 22px;
    font-weight: bold;
    z-index: 3;
    text-shadow: 2px 2px 5px black;
    pointer-events: none;
}

#fullscreen-btn {
    position: absolute;
    bottom: 25px;
    right: 20px;
    z-index: 5;
    background: rgba(255,255,255,0.2);
    border: 2px solid white;
    color: white;
    padding: 12px 20px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    display: none;
}

#loading {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 45%;
    left: 0;
    font-size: 19px;
    z-index: 6;
    background: rgba(0,0,0,0.75);
    padding: 20px 10px;
    line-height: 1.8;
}

#restart-btn {
    display: none;
    margin: 15px auto 0;
    padding: 12px 24px;
    background: #ff4646;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

@media(max-width:600px) {
    #ui {
        font-size: 17px;
        top: 12px;
    }

    #fullscreen-btn {
        font-size: 14px;
        padding: 10px 14px;
        bottom: 15px;
        right: 10px;
    }
}
</style>
</head>

<body>

<div id="container">

    <div id="ui">
        <div id="score">🍎 Σκορ: 0</div>
        <div id="timer">⏳ Χρόνος: 60s</div>
    </div>

    <button id="fullscreen-btn" onclick="openFullscreen()">
        📺 Fullscreen
    </button>

    <div id="loading">
        Αναμονή για την κάμερα...
        <br>
        Παρακαλώ περιμένετε.
        <button id="restart-btn" onclick="location.reload()">
            🔄 Επανάληψη
        </button>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

</div>

<script>

// ===================================
// ΣΤΟΙΧΕΙΑ HTML
// ===================================

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const loadingEl = document.getElementById("loading");
const fsBtn = document.getElementById("fullscreen-btn");
const restartBtn = document.getElementById("restart-btn");

// ===================================
// ΜΕΤΑΒΛΗΤΕΣ ΠΑΙΧΝΙΔΙΟΥ
// ===================================

let model = null;

let score = 0;
let timer = 60;

let gameOver = false;
let gameStarted = false;
let detecting = false;

let handsList = [];

let fruit = {
    x: 0,
    y: -50,
    speed: 4,
    size: 25
};

let bomb = {
    x: 0,
    y: -150,
    speed: 5,
    size: 22
};

let lastFruitHit = 0;
let lastBombHit = 0;

// ===================================
// ΑΛΛΑΓΗ ΜΕΓΕΘΟΥΣ CANVAS
// ===================================

function resize() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if (!fruit.x) resetFruit();
    if (!bomb.x) resetBomb();
}

window.addEventListener("resize", resize);

// ===================================
// ΕΠΑΝΑΦΟΡΑ ΦΡΟΥΤΟΥ
// ===================================

function resetFruit() {

    fruit.x = Math.random() * (canvas.width - 60) + 30;
    fruit.y = -50;
}

// ===================================
// ΕΠΑΝΑΦΟΡΑ ΒΟΜΒΑΣ
// ===================================

function resetBomb() {

    bomb.x = Math.random() * (canvas.width - 60) + 30;

    let attempts = 0;

    while (Math.abs(bomb.x - fruit.x) < 100 && attempts < 20) {

        bomb.x = Math.random() * (canvas.width - 60) + 30;
        attempts++;
    }

    bomb.y = -150;
}

// ===================================
// FULLSCREEN
// ===================================

async function openFullscreen() {

    const elem = document.documentElement;

    try {

        if (elem.requestFullscreen) {
            await elem.requestFullscreen();
        }
        else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        }

        fsBtn.style.display = "none";

    } catch (error) {

        console.error("Fullscreen error:", error);
    }
}

// ===================================
// ΚΑΜΕΡΑ
// ===================================

async function setupCamera() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        throw new Error(
            "Ο browser δεν υποστηρίζει πρόσβαση στην κάμερα. Χρησιμοποιήστε HTTPS."
        );
    }

    const stream = await navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30, max: 30 }
        },

        audio: false
    });

    video.srcObject = stream;

    await new Promise((resolve, reject) => {

        video.onloadedmetadata = resolve;

        video.onerror = () => {
            reject(new Error("Δεν φορτώθηκε η εικόνα της κάμερας."));
        };
    });

    await video.play();

    await new Promise(resolve => {

        if (video.readyState >= 2) {
            resolve();
        } else {
            video.onloadeddata = resolve;
        }
    });

    return video;
}

// ===================================
// ΣΧΕΔΙΑΣΗ ΦΡΟΥΤΟΥ
// ===================================

function drawFruit() {

    fruit.y += fruit.speed;

    ctx.save();

    ctx.shadowColor = "red";
    ctx.shadowBlur = 15;

    ctx.beginPath();
    ctx.fillStyle = "#ff4646";

    ctx.arc(
        fruit.x,
        fruit.y,
        fruit.size,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Φύλλο
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#4cff70";

    ctx.beginPath();

    ctx.ellipse(
        fruit.x + 10,
        fruit.y - 20,
        9,
        5,
        -0.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

    if (fruit.y > canvas.height + 40) {
        resetFruit();
    }
}

// ===================================
// ΣΧΕΔΙΑΣΗ ΒΟΜΒΑΣ
// ===================================

function drawBomb() {

    bomb.y += bomb.speed;

    ctx.save();

    ctx.shadowColor = "#bb55ff";
    ctx.shadowBlur = 15;

    ctx.beginPath();

    ctx.fillStyle = "#9632cc";

    ctx.arc(
        bomb.x,
        bomb.y,
        bomb.size,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Φυτίλι
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(bomb.x, bomb.y - bomb.size);
    ctx.lineTo(bomb.x + 8, bomb.y - bomb.size - 10);

    ctx.stroke();

    ctx.restore();

    if (bomb.y > canvas.height + 40) {
        resetBomb();
    }
}

// ===================================
// ΜΕΤΑΤΡΟΠΗ ΣΥΝΤΕΤΑΓΜΕΝΩΝ ΧΕΡΙΟΥ
// ===================================

function getHandPosition(palm) {

    const vWidth = video.videoWidth;
    const vHeight = video.videoHeight;

    // Αντιστοίχιση με object-fit: cover
    const scale = Math.max(
        canvas.width / vWidth,
        canvas.height / vHeight
    );

    const offsetX = (canvas.width - vWidth * scale) / 2;
    const offsetY = (canvas.height - vHeight * scale) / 2;

    // Καθρέφτισμα οριζόντια
    const x = canvas.width - (palm[0] * scale + offsetX);

    const y = palm[1] * scale + offsetY;

    return { x, y };
}

// ===================================
// ΑΝΑΓΝΩΡΙΣΗ ΧΕΡΙΟΥ
// ===================================

function drawHands() {

    handsList.forEach((hand, index) => {

        if (!hand.landmarks || !hand.landmarks[9]) {
            return;
        }

        const palm = hand.landmarks[9];

        const position = getHandPosition(palm);

        const hX = position.x;
        const hY = position.y;

        // Σχεδίαση ασπίδας χεριού
        ctx.save();

        ctx.beginPath();

        ctx.fillStyle = "rgba(50,255,150,0.65)";

        ctx.shadowColor = "#00ff99";
        ctx.shadowBlur = 20;

        ctx.arc(hX, hY, 40, 0, Math.PI * 2);

        ctx.fill();

        ctx.restore();

        // Συλλογή φρούτου
        if (
            Math.hypot(hX - fruit.x, hY - fruit.y) < 65
        ) {

            const now = Date.now();

            if (now - lastFruitHit > 250) {

                score += 10;

                scoreEl.innerText = "🍎 Σκορ: " + score;

                lastFruitHit = now;

                resetFruit();
            }
        }

        // Χτύπημα βόμβας
        if (
            Math.hypot(hX - bomb.x, hY - bomb.y) < 60
        ) {

            const now = Date.now();

            if (now - lastBombHit > 250) {

                score = Math.max(0, score - 15);

                scoreEl.innerText = "🍎 Σκορ: " + score;

                lastBombHit = now;

                resetBomb();
            }
        }
    });
}

// ===================================
// ΚΥΡΙΟΣ ΒΡΟΧΟΣ ΠΑΙΧΝΙΔΙΟΥ
// ===================================

function gameLoop() {

    if (gameOver) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawFruit();

    drawBomb();

    drawHands();

    requestAnimationFrame(gameLoop);
}

// ===================================
// AI HAND DETECTION
// ===================================

async function predictHands() {

    if (gameOver || !gameStarted) return;

    if (video.readyState >= 2 && model && !detecting) {

        detecting = true;

        try {

            handsList = await model.estimateHands(video);

        } catch (error) {

            console.error("Hand detection error:", error);

        } finally {

            detecting = false;
        }
    }

    // Περίπου 10 έλεγχοι το δευτερόλεπτο
    if (!gameOver) {

        setTimeout(predictHands, 100);
    }
}

// ===================================
// ΧΡΟΝΟΜΕΤΡΟ
// ===================================

function startTimer() {

    const countdown = setInterval(() => {

        if (gameOver) {

            clearInterval(countdown);
            return;
        }

        if (timer > 0) {

            timer--;

            timerEl.innerText = "⏳ Χρόνος: " + timer + "s";

        } else {

            gameOver = true;

            clearInterval(countdown);

            handsList = [];

            // Τελική οθόνη
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.fillStyle = "#ffd700";

            ctx.font = "bold 35px Arial";
            ctx.textAlign = "center";

            ctx.fillText(
                "🎉 ΤΕΛΟΣ ΠΑΙΧΝΙΔΙΟΥ! 🎉",
                canvas.width / 2,
                canvas.height / 2 - 30
            );

            ctx.fillStyle = "#ffffff";

            ctx.font = "bold 27px Arial";

            ctx.fillText(
                "Σκορ: " + score,
                canvas.width / 2,
                canvas.height / 2 + 25
            );

            ctx.font = "19px Arial";

            ctx.fillText(
                "Μπράβο! 👏",
                canvas.width / 2,
                canvas.height / 2 + 65
            );

            restartBtn.style.display = "block";
            loadingEl.style.display = "block";
            loadingEl.style.background = "transparent";
            loadingEl.style.top = "60%";
        }

    }, 1000);
}

// ===================================
// ΑΡΧΙΚΟΠΟΙΗΣΗ ΠΑΙΧΝΙΔΙΟΥ
// ===================================

async function main() {

    try {

        // Βήμα 1: Κάμερα
        loadingEl.innerText = "1/3 Άνοιγμα κάμερας...";

        await setupCamera();

        resize();

        console.log("Camera ready!");

        // Βήμα 2: TensorFlow
        loadingEl.innerText =
            "2/3 Φόρτωση TensorFlow AI...";

        if (typeof tf === "undefined") {

            throw new Error(
                "Δεν φορτώθηκε η βιβλιοθήκη TensorFlow.js. Ελέγξτε τη σύνδεση Internet."
            );
        }

        await tf.setBackend("webgl");

        await tf.ready();

        console.log("TensorFlow version:", tf.version.tfjs);
        console.log("Backend:", tf.getBackend());

        // Βήμα 3: Handpose
        loadingEl.innerText =
            "3/3 Φόρτωση μοντέλου αναγνώρισης χεριού...";

        if (typeof handpose === "undefined") {

            throw new Error(
                "Δεν φορτώθηκε η βιβλιοθήκη Handpose."
            );
        }

        model = await handpose.load({

            maxContinuousChecks: 5,
            detectionConfidence: 0.7,
            iouThreshold: 0.3,
            scoreThreshold: 0.75

        });

        console.log("Handpose loaded successfully!");

        // Έναρξη παιχνιδιού
        score = 0;
        timer = 60;

        scoreEl.innerText = "🍎 Σκορ: 0";
        timerEl.innerText = "⏳ Χρόνος: 60s";

        loadingEl.style.display = "none";

        fsBtn.style.display = "block";

        gameOver = false;
        gameStarted = true;

        resetFruit();
        resetBomb();

        gameLoop();

        predictHands();

        startTimer();

    } catch (error) {

        console.error("Initialization error:", error);

        gameStarted = false;

        loadingEl.style.display = "block";

        loadingEl.innerHTML =
            '<span style="color:#ff5555;font-weight:bold;">' +
            'ΣΦΑΛΜΑ ΑΡΧΙΚΟΠΟΙΗΣΗΣ</span><br>' +
            '<span style="font-size:15px;">' +
            error.message +
            '</span>';

        restartBtn.style.display = "block";
    }
}

// ===================================
// ΕΚΚΙΝΗΣΗ
// ===================================

main();

</script>

</body>
</html>
