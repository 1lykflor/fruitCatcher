
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magic Fruit Catcher</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #101528;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

#video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    z-index: 0;
    background: #101528;
}

#gameCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

#hud {
    position: fixed;
    top: 12px;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 8px;
}

.panel {
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    padding: 10px 18px;
    font-size: 18px;
    font-weight: bold;
    backdrop-filter: blur(5px);
}

#message {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    background: rgba(0,0,0,0.65);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    white-space: nowrap;
}

#overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8,12,27,0.88);
    padding: 20px;
}

#box {
    width: min(420px, 95%);
    text-align: center;
    background: #202b49;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}

h1 {
    font-size: 30px;
    margin-bottom: 12px;
    color: #ffe66d;
}

#instructions {
    line-height: 1.7;
    margin: 16px 0 22px;
    color: #e5e9ff;
}

button {
    border: none;
    background: linear-gradient(135deg,#ffb52e,#ff623d);
    color: white;
    font-size: 19px;
    font-weight: bold;
    padding: 15px 28px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#loading {
    margin-top: 15px;
    font-size: 14px;
    color: #ffe66d;
    min-height: 20px;
}

#restart {
    display: none;
    margin-top: 12px;
}

#fullscreen {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 5;
    width: auto;
    padding: 10px 14px;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

@media (max-width: 600px) {
    .panel {
        padding: 8px 12px;
        font-size: 15px;
    }
    #message {
        top: 75px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="gameCanvas"></canvas>

<div id="hud">
    <div class="panel">🍎 Σκορ: <span id="score">0</span></div>
    <div class="panel">⏱️ Χρόνος: <span id="timer">60</span></div>
</div>

<div id="message">Σήκωσε το χέρι σου μπροστά στην κάμερα</div>

<button id="fullscreen">⛶ Πλήρης οθόνη</button>

<div id="overlay">
    <div id="box">
        <h1>🍉 Magic Fruit Catcher</h1>

        <div id="instructions">
            Πιάσε τα φρούτα με την παλάμη σου!<br>
            🍎 Φρούτο: +10 πόντοι<br>
            💣 Βόμβα: -15 πόντοι<br><br>
            Κράτησε το χέρι σου μπροστά στην κάμερα
            και κούνησέ το για να πιάσεις τα φρούτα!
        </div>

        <button id="startBtn">▶ ΕΝΑΡΞΗ</button>
        <div id="loading">Έτοιμο για εκκίνηση</div>
        <button id="restart">🔄 Παίξε ξανά</button>
    </div>
</div>

<script>
"use strict";

// -------------------------------
// ΒΑΣΙΚΑ ΣΤΟΙΧΕΙΑ
// -------------------------------

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d", { alpha: true });

const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const messageEl = document.getElementById("message");
const overlay = document.getElementById("overlay");
const loadingEl = document.getElementById("loading");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restart");

let W = 0;
let H = 0;
let dpr = 1;

let score = 0;
let timeLeft = 60;
let playing = false;
let gameStarted = false;

let fruits = [];
let particles = [];

let handX = null;
let handY = null;
let targetX = null;
let targetY = null;

let lastDetection = 0;
let lastSpawn = 0;
let lastTimeUpdate = 0;
let lastFrame = 0;

let hands = null;
let cameraStream = null;
let detectionBusy = false;
let animationId = null;
let timerInterval = null;

const DETECTION_INTERVAL = 65;
const GAME_DURATION = 60;

// -------------------------------
// ΜΕΓΕΘΟΣ CANVAS
// -------------------------------

function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// -------------------------------
// ΑΡΧΙΚΟΠΟΙΗΣΗ MEDIAPIPE
// -------------------------------

async function initializeHands() {
    loadingEl.textContent = "1/3 - Προετοιμασία αναγνώρισης...";

    if (typeof Hands === "undefined") {
        throw new Error("Δεν φορτώθηκε η βιβλιοθήκη MediaPipe Hands.");
    }

    hands = new Hands({
        locateFile: (file) =>
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.55,
        minTrackingConfidence: 0.55
    });

    hands.onResults(onHandResults);

    loadingEl.textContent = "2/3 - Φόρτωση μοντέλου...";
    await hands.initialize();

    loadingEl.textContent = "3/3 - Μοντέλο έτοιμο!";
}

// -------------------------------
// ΚΑΜΕΡΑ
// -------------------------------

async function initializeCamera() {
    loadingEl.textContent = "Ενεργοποίηση κάμερας...";

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
        throw new Error("Η κάμερα απαιτεί HTTPS ή localhost.");
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30, max: 30 }
        }
    });

    video.srcObject = cameraStream;

    await new Promise((resolve, reject) => {
        video.onloadedmetadata = resolve;
        video.onerror = () => reject(new Error("Σφάλμα φόρτωσης κάμερας."));
    });

    await video.play();
}

// -------------------------------
// ΑΠΟΤΕΛΕΣΜΑ ΑΝΑΓΝΩΡΙΣΗΣ ΧΕΡΙΟΥ
// -------------------------------

function onHandResults(results) {
    if (!playing) return;

    if (results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0) {

        const landmarks = results.multiHandLandmarks[0];

        // Κέντρο παλάμης: landmark 9
        const palm = landmarks[9];

        const rawX = 1 - palm.x;
        const rawY = palm.y;

        // Αντιστοίχιση στην εικόνα που εμφανίζεται με object-fit: cover
        const videoW = video.videoWidth || 640;
        const videoH = video.videoHeight || 480;

        const scale = Math.max(W / videoW, H / videoH);
        const renderedW = videoW * scale;
        const renderedH = videoH * scale;

        targetX = rawX * renderedW + (W - renderedW) / 2;
        targetY = rawY * renderedH + (H - renderedH) / 2;

        if (handX === null) {
            handX = targetX;
            handY = targetY;
        }

        messageEl.textContent = "✋ Το χέρι εντοπίστηκε! Πιάσε τα φρούτα!";
    } else {
        targetX = null;
        targetY = null;
        messageEl.textContent = "✋ Δείξε το χέρι σου στην κάμερα";
    }
}

// -------------------------------
// ΕΛΕΓΧΟΣ ΧΕΡΙΟΥ
// -------------------------------

async function detectionLoop() {
    if (!playing) return;

    const now = performance.now();

    if (!detectionBusy &&
        video.readyState >= 2 &&
        now - lastDetection >= DETECTION_INTERVAL) {

        lastDetection = now;
        detectionBusy = true;

        try {
            await hands.send({ image: video });
        } catch (error) {
            console.error("Hand detection error:", error);
        } finally {
            detectionBusy = false;
        }
    }

    if (playing) {
        setTimeout(detectionLoop, 10);
    }
}

// -------------------------------
// ΔΗΜΙΟΥΡΓΙΑ ΦΡΟΥΤΩΝ
// -------------------------------

const fruitTypes = ["🍎", "🍊", "🍉", "🍇", "🍓", "🍍", "🍌"];

function spawnObject() {
    const isBomb = Math.random() < 0.18;

    fruits.push({
        x: 35 + Math.random() * (W - 70),
        y: -40,
        speed: 2.5 + Math.random() * 2.5,
        size: 32 + Math.random() * 12,
        emoji: isBomb ? "💣" :
            fruitTypes[Math.floor(Math.random() * fruitTypes.length)],
        bomb: isBomb,
        rotation: Math.random() * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.06
    });
}

// -------------------------------
// PARTICLES
// -------------------------------

function createParticles(x, y, color) {
    for (let i = 0; i < 9; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 1,
            color
        });
    }
}

// -------------------------------
// ΣΧΕΔΙΑΣΗ
// -------------------------------

function drawHandCursor() {
    if (handX === null || handY === null) return;

    // Ομαλή κίνηση
    handX += (targetX - handX) * 0.35;
    handY += (targetY - handY) * 0.35;

    ctx.beginPath();
    ctx.arc(handX, handY, 30, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 230, 80, 0.15)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(handX, handY, 19, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffe66d";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(handX, handY, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
}

function drawObjects() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const fruit of fruits) {
        ctx.save();
        ctx.translate(fruit.x, fruit.y);
        ctx.rotate(fruit.rotation);
        ctx.font = `${fruit.size}px Arial`;
        ctx.fillText(fruit.emoji, 0, 0);
        ctx.restore();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

// -------------------------------
// ΕΝΗΜΕΡΩΣΗ ΠΑΙΧΝΙΔΙΟΥ
// -------------------------------

function updateGame(delta) {
    const factor = Math.min(delta / 16.67, 2);

    // Νέα φρούτα
    const now = performance.now();

    if (now - lastSpawn > 750) {
        spawnObject();
        lastSpawn = now;
    }

    // Κίνηση αντικειμένων
    for (let i = fruits.length - 1; i >= 0; i--) {
        const fruit = fruits[i];

        fruit.y += fruit.speed * factor;
        fruit.rotation += fruit.rotationSpeed * factor;

        // Σύγκρουση με χέρι
        if (handX !== null && handY !== null) {
            const dx = fruit.x - handX;
            const dy = fruit.y - handY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < fruit.size / 2 + 24) {
                if (fruit.bomb) {
                    score = Math.max(0, score - 15);
                    createParticles(fruit.x, fruit.y, "#ff4444");
                } else {
                    score += 10;
                    createParticles(fruit.x, fruit.y, "#ffe66d");
                }

                scoreEl.textContent = score;
                fruits.splice(i, 1);
                continue;
            }
        }

        // Αντικείμενα που έφυγαν από την οθόνη
        if (fruit.y > H + 60) {
            fruits.splice(i, 1);
        }
    }

    // Ενημέρωση particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx * factor;
        p.y += p.vy * factor;
        p.life -= 0.035 * factor;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

// -------------------------------
// GAME LOOP
// -------------------------------

function gameLoop(timestamp) {
    if (!playing) return;

    const delta = lastFrame ? timestamp - lastFrame : 16.67;
    lastFrame = timestamp;

    ctx.clearRect(0, 0, W, H);

    updateGame(delta);
    drawObjects();
    drawParticles();
    drawHandCursor();

    animationId = requestAnimationFrame(gameLoop);
}

// -------------------------------
// ΧΡΟΝΟΜΕΤΡΟ
// -------------------------------

function startTimer() {
    clearInterval(timerInterval);

    timeLeft = GAME_DURATION;
    timerEl.textContent = timeLeft;

    timerInterval = setInterval(() => {
        if (!playing) return;

        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
            endGame();
        }
    }, 1000);
}

// -------------------------------
// ΕΝΑΡΞΗ
// -------------------------------

async function startGame() {
    startBtn.disabled = true;
    restartBtn.style.display = "none";

    try {
        loadingEl.textContent = "Φόρτωση συστήματος...";

        if (!hands) {
            await initializeHands();
        }

        await initializeCamera();

        score = 0;
        timeLeft = GAME_DURATION;
        fruits = [];
        particles = [];

        handX = null;
        handY = null;
        targetX = null;
        targetY = null;

        scoreEl.textContent = "0";
        timerEl.textContent = GAME_DURATION;

        lastSpawn = performance.now();
        lastFrame = 0;
        lastDetection = 0;
        detectionBusy = false;

        playing = true;
        gameStarted = true;

        overlay.classList.add("hidden");

        messageEl.textContent = "✋ Δείξε το χέρι σου στην κάμερα";

        startTimer();

        detectionLoop();
        animationId = requestAnimationFrame(gameLoop);

    } catch (error) {
        console.error(error);

        loadingEl.textContent =
            "Σφάλμα: " + (error.message || "Δεν ήταν δυνατή η εκκίνηση.");

        startBtn.disabled = false;
        restartBtn.style.display = "block";

        stopCamera();
    }
}

// -------------------------------
// ΤΕΛΟΣ ΠΑΙΧΝΙΔΙΟΥ
// -------------------------------

function endGame() {
    playing = false;

    clearInterval(timerInterval);
    clearTimeout(detectionLoop.timeout);
    cancelAnimationFrame(animationId);

    messageEl.textContent = "🏁 Το παιχνίδι τελείωσε!";

    overlay.classList.remove("hidden");

    document.getElementById("instructions").innerHTML =
        `🏆 Τελικό σκορ: <strong>${score}</strong><br><br>
         Μπράβο! Θέλεις να ξαναπαίξεις;`;

    loadingEl.textContent = "Το παιχνίδι ολοκληρώθηκε.";

    startBtn.style.display = "none";
    restartBtn.style.display = "block";

    stopCamera();
}

// -------------------------------
// ΔΙΑΚΟΠΗ ΚΑΜΕΡΑΣ
// -------------------------------

function stopCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    video.srcObject = null;
}

// -------------------------------
// ΚΟΥΜΠΙΑ
// -------------------------------

startBtn.addEventListener("click", startGame);

restartBtn.addEventListener("click", () => {
    document.getElementById("instructions").innerHTML =
        `Πιάσε τα φρούτα με την παλάμη σου!<br>
         🍎 Φρούτο: +10 πόντοι<br>
         💣 Βόμβα: -15 πόντοι<br><br>
         Κράτησε το χέρι σου μπροστά στην κάμερα!`;

    startBtn.style.display = "block";
    startBtn.disabled = false;
    restartBtn.style.display = "none";

    startGame();
});

document.getElementById("fullscreen").addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.log("Fullscreen unavailable:", error);
    }
});

// -------------------------------
// ΚΑΘΑΡΙΣΜΟΣ
// -------------------------------

window.addEventListener("beforeunload", () => {
    playing = false;
    clearInterval(timerInterval);
    stopCamera();
});

</script>
</body>
</html>
