<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Magic Fruit Catcher Mobile</title>
  <!-- Εισαγωγή MediaPipe και TensorFlow για Web -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #191e32;
      overflow: hidden;
      font-family: sans-serif;
      color: white;
      user-select: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* Η κάμερα κρύβεται στο παρασκήνιο ή φαίνεται αχνά */
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Καθρεφτισμός */
      opacity: 0.15; /* Αχνή για να βλέπει το παιδί πού βάζει το χέρι του */
      z-index: 1;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 2;
      top: 0;
      left: 0;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 24px;
      font-weight: bold;
      z-index: 3;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #loading {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 45%;
      font-size: 20px;
      z-index: 4;
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="ui">
      <div id="score">🍎 Σκορ: 0</div>
      <div id="timer">⏳ Χρόνος: 60s</div>
    </div>
    <div id="loading">Παρακαλώ επιτρέψτε την κάμερα...<br>Φόρτωση AI ανίχνευσης...</div>
    <video id="video" playsinline autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const loadingEl = document.getElementById('loading');

    let model = null;
    let score = 0;
    let timer = 60;
    let gameOver = false;

    // Στοιχεία παιχνιδιού
    let fruit = { x: 0, y: -50, speed: 4, size: 25 };
    let bomb = { x: 0, y: -150, speed: 5, size: 20 };
    let handsList = [];

    // Προσαρμογή μεγέθους οθόνης
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if(fruit.y === -50) resetFruit();
      if(bomb.y === -150) resetBomb();
    }
    window.addEventListener('resize', resize);

    function resetFruit() {
      fruit.x = Math.random() * (canvas.width - 60) + 30;
      fruit.y = -50;
      fruit.speed += 0.2;
    }

    function resetBomb() {
      bomb.x = Math.random() * (canvas.width - 60) + 30;
      while(Math.abs(bomb.x - fruit.x) < 80) {
        bomb.x = Math.random() * (canvas.width - 60) + 30;
      }
      bomb.y = -200;
    }

    // Εκκίνηση Κάμερας
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => { resolve(video); };
      });
    }

    // Κύριο loop του παιχνιδιού
    function gameLoop() {
      if (gameOver) return;

      // Καθαρισμός οθόνης
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Κίνηση Φρούτου
      fruit.y += fruit.speed;
      ctx.beginPath();
      ctx.fillStyle = '#ff4646'; // Κόκκινο Φρούτο
      ctx.arc(fruit.x, fruit.y, fruit.size, 0, Math.PI * 2);
      ctx.fill();
      if (fruit.y > canvas.height) resetFruit();

      // Κίνηση Βόμβας
      bomb.y += bomb.speed;
      ctx.beginPath();
      ctx.fillStyle = '#9632cc'; // Μωβ Βόμβα
      ctx.arc(bomb.x, bomb.y, bomb.size, 0, Math.PI * 2);
      ctx.fill();
      if (bomb.y > canvas.height) resetBomb();

      // Σχεδίαση Καλαθιών/Χεριών από τα δεδομένα του AI
      handsList.forEach((hand, index) => {
        // Παίρνουμε τη θέση του καρπού (Index 0) ή της παλάμης (Index 9)
        const palm = hand.landmarks[9];
        // Μετατροπή των συντεταγμένων στην οθόνη (με καθρεφτισμό X)
        const hX = canvas.width - (palm[0] / video.videoWidth * canvas.width);
        const hY = palm[1] / video.videoHeight * canvas.height;

        // Σχεδίαση Ασπίδας
        ctx.beginPath();
        ctx.fillStyle = index === 0 ? 'rgba(50, 255, 150, 0.7)' : 'rgba(0, 200, 255, 0.7)';
        ctx.arc(hX, hY, 35, 0, Math.PI * 2);
        ctx.fill();

        // Έλεγχος Σύγκρουσης με Φρούτο
        let distFruit = Math.hypot(hX - fruit.x, hY - fruit.y);
        if (distFruit < 60) {
          score += 10;
          scoreEl.innerText = `🍎 Σκορ: ${score}`;
          resetFruit();
        }

        // Έλεγχος Σύγκρουσης με Βόμβα
        let distBomb = Math.hypot(hX - bomb.x, hY - bomb.y);
        if (distBomb < 55) {
          score = Math.max(0, score - 15);
          scoreEl.innerText = `🍎 Σκορ: ${score}`;
          resetBomb();
        }
      });

      requestAnimationFrame(gameLoop);
    }

    // Συνεχής ανίχνευση χεριών από την κάμερα
    async function predictHands() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        handsList = await model.estimateHands(video);
      }
      setTimeout(predictHands, 1000 / 30); // 30 φορές το δευτερόλεπτο (χωρίς lag!)
    }

    // Αντίστροφη μέτρηση χρόνου
    const countdown = setInterval(() => {
      if (timer > 0) {
        timer--;
        timerEl.innerText = `⏳ Χρόνος: ${timer}s`;
      } else {
        gameOver = true;
        clearInterval(countdown);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("🎉 ΤΕΛΟΣ ΠΑΙΧΝΙΔΙΟΥ! 🎉", canvas.width/2, canvas.height/2 - 20);
        ctx.font = '24px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Σκορ Ομάδας: ${score}`, canvas.width/2, canvas.height/2 + 30);
      }
    }, 1000);

    // Εκκίνηση των πάντων
    async function main() {
      try {
        await setupCamera();
        video.play();
        resize();
        
        // Φόρτωση του ελαφριού μοντέλου Handpose για Web
        model = await handpose.load();
        loadingEl.style.display = 'none';
        
        gameLoop();
        predictHands();
      } catch (e) {
        loadingEl.innerText = "Σφάλμα κατά το άνοιγμα της κάμερας.";
        console.error(e);
      }
    }

    main();
  </script>
</body>
</html>
